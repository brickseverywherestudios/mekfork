name: anomech-relay

services:
  relay:
    build:
      context: ../..
      dockerfile: AnoMech.Relay.Host/Dockerfile
    image: anomech-relay:local
    restart: unless-stopped
    command:
      - --port
      - "7890"
      - --trusted-proxy
      - 172.30.77.2/32
      - --require-tls
      - --log-dir
      - /app/logs
    environment:
      ANOMECH_RELAY_TOKEN: ${ANOMECH_RELAY_TOKEN:-}
      ANOMECH_RELAY_ADMIN_TOKEN: ${ANOMECH_RELAY_ADMIN_TOKEN:-}
    volumes:
      - relay_logs:/app/logs
    networks:
      relay_net:
        ipv4_address: 172.30.77.3
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 1.0
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - relay
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      RELAY_DOMAIN: ${RELAY_DOMAIN:?set RELAY_DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      relay_net:
        # The relay only believes X-Forwarded-* from this address (--trusted-proxy above).
        ipv4_address: 172.30.77.2

networks:
  relay_net:
    ipam:
      config:
        - subnet: 172.30.77.0/24

volumes:
  relay_logs:
  caddy_data:
  caddy_config:
